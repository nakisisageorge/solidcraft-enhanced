[package]
name = "solidcraft-mcp"
description = "SolidCraft MCP server: JSON-RPC 2.0 over stdio, HTTP, SSE, and WebSocket, driving a headless session or the running app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-engine = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { workspace = true }

[features]
default = ["http", "sse", "ws"]
http = []
sse = []
ws = []

[dev-dependencies]
solidcraft-gpu = { workspace = true }
image = { workspace = true }