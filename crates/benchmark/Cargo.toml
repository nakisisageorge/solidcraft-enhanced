[package]
name = "solidcraft-benchmark"
description = "SolidCraft benchmark suite with regression detection for CAD operations"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-sketch = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-io = { workspace = true }
solidcraft-render = { workspace = true }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
solidcraft-testkit = { workspace = true }